name: Test

on: [push, pull_request]

jobs:
  mocha:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - "18"
          - "20"
          - "lts/*"
    steps:
     - uses: actions/checkout@v6
     - uses: actions/setup-node@v6
       with:
         node-version: ${{ matrix.node }}
     - run: npm ci
     - run: npm test
     - uses: codecov/codecov-action@v6
       with:
         token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
     - uses: actions/checkout@v6
     - uses: actions/setup-node@v6
       with:
         node-version: "lts/*"
     - run: npm ci
     - run: npm run lint

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - "18"
          - "20"
          - "lts/*"
    steps:
     - uses: actions/checkout@v6
     - uses: actions/setup-node@v6
       with:
         node-version: ${{ matrix.node }}
     - run: npm ci
     - run: npx tsc --noEmit
